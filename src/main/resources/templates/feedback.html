<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" th:href="@{css/navigation.css}">
    <link rel="stylesheet" th:href="@{css/feedback.css}">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Обратная связь</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
<div th:replace="~{navigation :: navbar}"></div>
<div class="container">
    <h1>Обратная связь</h1>
    <div class="section">
        <form class="contact-form" action="#" method="POST">
            <div class="form-group">
                <label for="fullname">ФИО</label>
                <input type="text" id="fullname" name="fullname" required placeholder="Введите ваше полное имя">
            </div>

            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required placeholder="Введите ваш email">
            </div>

            <div class="form-group">
                <label for="message">Текст обращения</label>
                <textarea id="message" name="message" required placeholder="Опишите ваше обращение..." rows="5"></textarea>
            </div>

            <button type="submit" class="submit-btn">Отправить</button>
        </form>
    </div>

</div>
</body>
</html>
